    <p1>
      <table class="table-gallery">
        <caption>
          Ludwig Image Gallery
          <br /><sup>Click an image to enlarge</sup>
        </caption>
        <!-- Snare pics Row-->
        <tr>
          <th class="th-gallery">Snare</th>
          <td class="td-gallery">
            <a href="/images/ludwig/snare.jpg">
              <img
                src="/images/ludwig/snare-small.jpg"
                alt="Ludwig Snare Drum"
                class="thumb-pic2"
              />
            </a>
          </td>
          <td class="td-gallery">
            <a href="/images/ludwig/snare-a.jpg">
              <img
                src="/images/ludwig/snare-a-small.jpg"
                alt="Ludwig Snare Drum"
                class="thumb-pic2"
              />
            </a>
          </td>
        </tr>
        <!-- TomTom pics Row-->
        <tr>
          <th class="th-gallery">TomTom</th>
          <td class="td-gallery">
            <a href="/images/ludwig/tomtom-a.jpg">
              <img
                src="/images/ludwig/tomtom-a-small.jpg"
                alt="Ludwig TomTom Drum"
                class="thumb-pic2"
              />
            </a>
          </td>
          <td class="td-gallery">
            <a href="/images/ludwig/tomtom-c.jpg">
              <img
                src="/images/ludwig/tomtom-c-small.jpg"
                alt="Ludwig TomTom Drum"
                class="thumb-pic2"
              />
            </a>
          </td>
        </tr>
        <!-- Floor Tom pics Row-->
        <tr>
          <th class="th-gallery">Floor Tom</th>
          <td class="td-gallery">
            <a href="/images/ludwig/floortom-a.jpg">
              <img
                src="/images/ludwig/floortom-a-small.jpg"
                alt="Ludwig Floor Tom Drum"
                class="thumb-pic2"
              />
            </a>
          </td>
          <td class="td-gallery">
            <a href="/images/ludwig/floortom-b.jpg">
              <img
                src="/images/ludwig/floortom-b-small.jpg"
                alt="Ludwig Floor Tom Drum"
                class="thumb-pic2"
              />
            </a>
          </td>
        </tr>
        <!-- Kick pics Row-->
        <tr>
          <th class="th-gallery">Kick</th>
          <td class="td-gallery" style="border-bottom-width: 1px">
            <a href="/images/ludwig/kick.jpg">
              <img
                src="/images/ludwig/kick-small.jpg"
                alt="Ludwig Kick Drum"
                class="thumb-pic2"
              />
            </a>
          </td>
          <td class="td-gallery" style="border-bottom-width: 1px">
            <a href="/images/ludwig/kick-c.jpg">
              <img
                src="/images/ludwig/kick-c-small.jpg"

                class="thumb-pic2"
              />
            </a>
          </td>
          <td class="td-gallery" style="border-bottom-width: 1px">
            <a href="/images/ludwig/kick-b.jpg">
              <img
                src="/images/ludwig/kick-b-small.jpg"
                alt="Ludwig Kick Drum"
                class="thumb-pic2"
              />
            </a>
          </td>
        </tr>
